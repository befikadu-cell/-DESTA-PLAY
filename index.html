<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESTA PLAY</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .header {
            padding: 25px 15px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
        }

        .subtitle {
            color: #94a3b8;
            margin-top: 6px;
        }

        .balance {
            margin: 15px;
            padding: 18px;
            border-radius: 16px;
            background: #1e293b;
        }

        .balance-number {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        .games {
            padding: 10px 15px;
        }

        .game {
            width: 100%;
            margin: 10px 0;
            padding: 18px;
            border: none;
            border-radius: 15px;
            background: #334155;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .game:active {
            transform: scale(0.98);
        }

        .footer {
            margin: 25px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">🎮 DESTA PLAY</div>
        <div class="subtitle">Play • Have Fun • Enjoy</div>
    </div>

    <div class="balance">
        🪙 Demo Balance
        <div class="balance-number">1,000 ETB</div>
    </div>

    <div class="games">

        <button class="game">🎱 Keno</button>

        <button class="game">🎟️ Bingo</button>

        <button class="game">🎡 Spin</button>

        <button class="game">✈️ Aviator Demo</button>

    </div>

    <div class="footer">
        DESTA PLAY — Demo Version
    </div>

</body>
</html>
