<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESTA PLAY — 24/7 Live Gaming Platform</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #22c55e;
            --accent-gold: #eab308;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        h1 { font-size: 1.8rem; color: var(--accent-gold); }
        .live-badge {
            background: #22c55e22;
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-BETTING { background: #3b82f633; color: #60a5fa; }
        .status-DRAWING, .status-SPINNING, .status-FLYING { background: #eab30833; color: #fde047; }
        .status-FINISHED, .status-CRASHED { background: #ef444433; color: #fca5a5; }

        .timer-display {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            margin: 10px 0;
            color: var(--text-light);
        }

        .draw-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 45px;
            align-items: center;
        }

        .ball {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #334155;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .ball.active { background: var(--accent-green); }

        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        select { background: #0f172a; color: white; border: 1px solid #334155; }
        button { background: var(--accent-green); color: #000; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1>DESTA PLAY 24/7</h1>
        <div class="live-badge">
            <div class="live-dot"></div> CONTINUOUS ENGINE
        </div>
    </header>

    <div class="grid">
        <!-- PVP BINGO ROOMS CARD -->
        <div class="card">
            <div class="card-header">
                <h3>Multi-Tier Bingo</h3>
                <span id="bingo-status" class="status-pill status-BETTING">BETTING</span>
            </div>
            
            <label for="bingo-tier-select" style="font-size: 0.85rem; color: var(--text-muted);">Select Stake Tier:</label>
            <select id="bingo-tier-select" onchange="renderBingoTier()">
                <option value="10">10 ETB Tier</option>
                <option value="20">20 ETB Tier</option>
                <option value="50">50 ETB Tier</option>
                <option value="100">100 ETB Tier</option>
                <option value="500">500 ETB Tier</option>
            </select>

            <div id="bingo-timer" class="timer-display">00s</div>
            
            <div style="font-size: 0.85rem; color: var(--text-muted);">
                Players: <span id="bingo-players" style="color:#fff;">0</span> | 
                Prize Pool: <span id="bingo-pool" style="color:var(--accent-gold);">0 ETB</span>
            </div>

            <div class="draw-grid" id="bingo-balls"></div>
        </div>

        <!-- LIVE HOUSE KENO CARD -->
        <div class="card">
            <div class="card-header">
                <h3>Continuous Keno</h3>
                <span id="keno-status" class="status-pill status-BETTING">BETTING</span>
            </div>
            <div id="keno-timer" class="timer-display">00s</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">Drawn Numbers (20 Max):</div>
            <div class="draw-grid" id="keno-balls"></div>
        </div>

        <!-- AVIATOR CRASH CARD -->
        <div class="card">
            <div class="card-header">
                <h3>Aviator Crash</h3>
                <span id="aviator-status" class="status-pill status-BETTING">BETTING</span>
            </div>
            <div id="aviator-multiplier" class="timer-display" style="color: var(--accent-gold);">1.00x</div>
            <div id="aviator-sub" style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">Waiting for takeoff...</div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let globalBingoRooms = {};

        async function fetchLiveEngineState() {
            try {
                // Fetch Bingo PVP state
                const bingoRes = await fetch(`${API_BASE}/api/bingo/rooms`);
                const bingoData = await bingoRes.json();
                if (bingoData.success) {
                    globalBingoRooms = bingoData.rooms;
                    renderBingoTier();
                }

                // Fetch House games status (Keno, Roulette, Aviator)
                const houseRes = await fetch(`${API_BASE}/api/status`);
                const houseData = await houseRes.json();
                if (houseData.success && houseData.games) {
                    updateHouseGamesUI(houseData.games);
                }
            } catch (err) {
                console.error("Syncing error with 24/7 backend loop:", err);
            }
        }

        function renderBingoTier() {
            const selectedTier = document.getElementById("bingo-tier-select").value;
            const room = globalBingoRooms[selectedTier];
            if (!room) return;

            const statusEl = document.getElementById("bingo-status");
            statusEl.textContent = room.status;
            statusEl.className = `status-pill status-${room.status}`;

            document.getElementById("bingo-timer").textContent = room.remainingSeconds > 0 ? `${room.remainingSeconds}s` : "--";
            document.getElementById("bingo-players").textContent = room.totalPlayers;
            document.getElementById("bingo-pool").textContent = `${room.winnerPrize} ETB`;

            const ballsContainer = document.getElementById("bingo-balls");
            ballsContainer.innerHTML = "";
            (room.drawnNumbers || []).slice(-10).forEach(num => {
                const ball = document.createElement("div");
                ball.className = "ball active";
                ball.textContent = num;
                ballsContainer.appendChild(ball);
            });
        }

        function updateHouseGamesUI(games) {
            // Update Keno
            const keno = games.keno;
            if (keno) {
                const kenoStatus = document.getElementById("keno-status");
                kenoStatus.textContent = keno.status;
                kenoStatus.className = `status-pill status-${keno.status}`;
                document.getElementById("keno-timer").textContent = keno.remainingSeconds > 0 ? `${keno.remainingSeconds}s` : "--";
                
                const kenoBalls = document.getElementById("keno-balls");
                kenoBalls.innerHTML = "";
                (keno.drawnNumbers || []).forEach(num => {
                    const ball = document.createElement("div");
                    ball.className = "ball active";
                    ball.textContent = num;
                    kenoBalls.appendChild(ball);
                });
            }

            // Update Aviator
            const aviator = games.aviator;
            if (aviator) {
                const aviatorStatus = document.getElementById("aviator-status");
                aviatorStatus.textContent = aviator.status;
                aviatorStatus.className = `status-pill status-${aviator.status}`;

                const multEl = document.getElementById("aviator-multiplier");
                const subEl = document.getElementById("aviator-sub");

                if (aviator.status === "BETTING") {
                    multEl.textContent = "1.00x";
                    multEl.style.color = "var(--text-light)";
                    subEl.textContent = `Next flight in ${aviator.remainingSeconds}s`;
                } else if (aviator.status === "FLYING") {
                    multEl.textContent = `${aviator.multiplier.toFixed(2)}x`;
                    multEl.style.color = "var(--accent-gold)";
                    subEl.textContent = "Plane in flight!";
                } else if (aviator.status === "CRASHED") {
                    multEl.textContent = `${aviator.crashPoint.toFixed(2)}x`;
                    multEl.style.color = "var(--accent-red)";
                    subEl.textContent = "Flew Away!";
                }
            }
        }

        // START LIVE 24/7 POLLING ENGINE (Ticks every 1 second)
        fetchLiveEngineState();
        setInterval(fetchLiveEngineState, 1000);
    </script>
</body>
</html>
