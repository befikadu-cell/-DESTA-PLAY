<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DESTA PLAY</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER & WALLET */
    .topBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #38bdf8;
    }

    .balanceContainer {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    .balanceVal {
      font-weight: 700;
      color: #4ade80;
    }

    .btnAction {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* NAVIGATION */
    .navTabs {
      display: flex;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }

    .tabBtn {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tabBtn.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }

    /* MAIN CONTAINER */
    .mainContent {
      flex: 1;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    .gameView {
      display: none;
    }

    .gameView.active {
      display: block;
    }

    /* KENO GRID */
    .kenoGrid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    .kenoNum {
      aspect-ratio: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .kenoNum.selected {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    .kenoNum.hit {
      background: #4ade80;
      color: #0f172a;
    }

    .kenoNum.miss {
      background: #ef4444;
      color: #ffffff;
    }

    /* CONTROLS & FORM ELEMENTS */
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btnSecondary {
      background: #334155;
      color: #f8fafc;
    }

    /* MODALS */
    .walletModal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .walletModal.hidden {
      display: none;
    }

    .walletModalPanel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
    }

    .walletModalHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .walletModalClose {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .walletHint {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .walletFormLabel {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .walletFormInput, .walletFormSelect {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      margin-bottom: 12px;
    }

    .walletSubmit {
      width: 100%;
      padding: 12px;
      background: #4ade80;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .walletStatus {
      margin-top: 12px;
      font-size: 0.85rem;
      text-align: center;
    }

    .walletStatus.err { color: #ef4444; }
    .walletStatus.ok { color: #4ade80; }
    .walletStatus.wait { color: #f59e0b; }

    .transactionRow {
      border-bottom: 1px solid #334155;
      padding: 8px 0;
      font-size: 0.8rem;
    }

    .transactionStatus {
      font-weight: 700;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .statusCompleted { background: #064e3b; color: #34d399; }
    .statusPending { background: #78350f; color: #fbbf24; }
    .statusFailed { background: #7f1d1d; color: #f87171; }
  </style>
</head>
<body>

  <div class="topBar">
    <div class="brand">DESTA PLAY</div>
    <div class="balanceContainer">
      <span class="balanceVal"><span id="userBalance">0.00</span> ETB</span>
      <button class="btnAction" onclick="openDeposit()">+</button>
    </div>
  </div>

  <div class="navTabs">
    <button class="tabBtn active" onclick="switchTab('keno')">Keno</button>
    <button class="tabBtn" onclick="openWithdraw()">Withdraw</button>
    <button class="tabBtn" onclick="openHelp()">Help</button>
  </div>

  <div class="mainContent">
    <div id="kenoView" class="gameView active">
      <div id="kenoGrid" class="kenoGrid"></div>
      <div class="controls">
        <button class="btn btnSecondary" onclick="clearKenoSelection()">Clear</button>
        <button class="btn btnSecondary" onclick="quickPickKeno()">Quick Pick</button>
        <button id="playKenoBtn" class="btn" onclick="playKeno()">PLAY</button>
      </div>
    </div>
  </div>

  <div id="helpOverlay" class="walletModal hidden">
    <div class="walletModalPanel">
      <div class="walletModalHead">
        <h2>HOW TO PLAY</h2>
        <button class="walletModalClose" onclick="closeHelp()">✕</button>
      </div>
      <div id="helpContent" style="font-size: 0.85rem; color: #cbd5e1; line-height: 1.5;"></div>
    </div>
  </div>

<script>
/* =========================================================
   GLOBAL STATE & HELPER FUNCTIONS
========================================================= */

const state = {
  game: "keno",
  balance: 0.00,
  authToken: localStorage.getItem("destaAuthToken") || "",
  selectedKeno: [],
  user: null
};

const help = {
  keno: {
    html: "<p>Select 1 to 10 numbers from the grid. Click PLAY to start the draw. Winnings are calculated automatically based on your hits!</p>"
  }
};

function safeJsonResponse(response) {
  return response.json().catch(() => ({ success: false, error: "Invalid response from server" }));
}

function loadTelegramUser() {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    state.user = window.Telegram.WebApp.initDataUnsafe?.user || null;
    if (window.Telegram.WebApp.initData) {
      state.authToken = window.Telegram.WebApp.initData;
      localStorage.setItem("destaAuthToken", state.authToken);
    }
  }
}

function updateBalance() {
  const el = document.getElementById("userBalance");
  if (el) el.textContent = state.balance.toFixed(2);
}

function switchTab(tab) {
  state.game = tab;
  document.querySelectorAll(".tabBtn").forEach(btn => btn.classList.remove("active"));
  document.querySelectorAll(".gameView").forEach(view => view.classList.remove("active"));
  
  if (tab === "keno") {
    document.getElementById("kenoView").classList.add("active");
    event.target.classList.add("active");
  }
}

function buildKeno() {
  const grid = document.getElementById("kenoGrid");
  if (!grid) return;
  grid.innerHTML = "";
  for (let i = 1; i <= 80; i++) {
    const btn = document.createElement("div");
    btn.className = "kenoNum";
    btn.textContent = i;
    btn.onclick = () => toggleKenoNum(i, btn);
    grid.appendChild(btn);
  }
}

function toggleKenoNum(num, el) {
  const idx = state.selectedKeno.indexOf(num);
  if (idx > -1) {
    state.selectedKeno.splice(idx, 1);
    el.classList.remove("selected");
  } else {
    if (state.selectedKeno.length >= 10) return;
    state.selectedKeno.push(num);
    el.classList.add("selected");
  }
}

function clearKenoSelection() {
  state.selectedKeno = [];
  document.querySelectorAll(".kenoNum").forEach(el => {
    el.classList.remove("selected", "hit", "miss");
  });
}

function quickPickKeno() {
  clearKenoSelection();
  const nums = [];
  while (nums.length < 5) {
    const r = Math.floor(Math.random() * 80) + 1;
    if (!nums.includes(r)) nums.push(r);
  }
  state.selectedKeno = nums;
  const gridNums = document.querySelectorAll(".kenoNum");
  nums.forEach(n => gridNums[n - 1].classList.add("selected"));
}

function playKeno() {
  if (state.selectedKeno.length === 0) return alert("Select at least 1 number.");
  alert("Playing Keno with: " + state.selectedKeno.join(", "));
}

function openHelp() {
  document.getElementById("helpContent").innerHTML = help[state.game].html;
  document.getElementById("helpOverlay").classList.remove("hidden");
}

function closeHelp() {
  document.getElementById("helpOverlay").classList.add("hidden");
}

/* =========================================================
   WALLET / MODALS
========================================================= */

function openDeposit() {
  document.getElementById("depositModal").classList.remove("hidden");
  fetchTransactionHistory();
}

function closeDeposit() {
  document.getElementById("depositModal").classList.add("hidden");
}

function openWithdraw() {
  document.getElementById("withdrawModal").classList.remove("hidden");
  fetchTransactionHistory();
}

function closeWithdraw() {
  document.getElementById("withdrawModal").classList.add("hidden");
}

async function submitDeposit() {
  const amount = Number(document.getElementById("depAmount").value);
  const provider = document.getElementById("depProvider").value;
  const referenceId = document.getElementById("depRef").value.trim();
  const statusEl = document.getElementById("depStatus");

  if (!amount || amount < 10) {
    statusEl.className = "walletStatus err";
    statusEl.textContent = "Minimum deposit amount is 10 ETB.";
    return;
  }
  if (!referenceId) {
    statusEl.className = "walletStatus err";
    statusEl.textContent = "Transaction / Reference ID is required.";
    return;
  }

  statusEl.className = "walletStatus wait";
  statusEl.textContent = "Submitting deposit request...";

  try {
    const response = await fetch("https://desta-play.onrender.com/api/wallet/deposit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
        "Authorization": "Bearer " + (state.authToken || localStorage.getItem("destaAuthToken"))
      },
      body: JSON.stringify({ amount, provider, referenceId })
    });
    const data = await safeJsonResponse(response);
    if (!response.ok || !data.success) throw new Error(data.error || "Deposit submission failed.");

    statusEl.className = "walletStatus ok";
    statusEl.textContent = "Deposit submitted! Pending SMS & admin verification.";
    document.getElementById("depAmount").value = "";
    document.getElementById("depRef").value = "";
    fetchTransactionHistory();
  } catch (err) {
    statusEl.className = "walletStatus err";
    statusEl.textContent = err.message || "Failed to submit deposit.";
  }
}

async function submitWithdraw() {
  const amount = Number(document.getElementById("wdAmount").value);
  const provider = document.getElementById("wdProvider").value;
  const accountNumber = document.getElementById("wdAccount").value.trim();
  const statusEl = document.getElementById("wdStatus");

  if (!amount || amount < 50) {
    statusEl.className = "walletStatus err";
    statusEl.textContent = "Minimum withdrawal amount is 50 ETB.";
    return;
  }
  if (!accountNumber) {
    statusEl.className = "walletStatus err";
    statusEl.textContent = "Destination phone/account number is required.";
    return;
  }

  statusEl.className = "walletStatus wait";
  statusEl.textContent = "Submitting withdrawal request...";

  try {
    const response = await fetch("https://desta-play.onrender.com/api/wallet/withdraw", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
        "Authorization": "Bearer " + (state.authToken || localStorage.getItem("destaAuthToken"))
      },
      body: JSON.stringify({ amount, provider, accountNumber })
    });
    const data = await safeJsonResponse(response);
    if (!response.ok || !data.success) throw new Error(data.error || "Withdrawal failed.");

    statusEl.className = "walletStatus ok";
    statusEl.textContent = "Withdrawal request submitted for approval.";
    document.getElementById("wdAmount").value = "";
    document.getElementById("wdAccount").value = "";
    if (data.balance !== undefined) {
      state.balance = Number(data.balance);
      updateBalance();
    }
    fetchTransactionHistory();
  } catch (err) {
    statusEl.className = "walletStatus err";
    statusEl.textContent = err.message || "Failed to submit withdrawal.";
  }
}

async function fetchTransactionHistory() {
  const token = state.authToken || localStorage.getItem("destaAuthToken");
  if (!token) return;

  try {
    const response = await fetch("https://desta-play.onrender.com/api/wallet/transactions", {
      headers: {
        "Accept": "application/json",
        "Authorization": "Bearer " + token
      }
    });
    const data = await safeJsonResponse(response);
    if (response.ok && data.success) {
      if (data.balance !== undefined) {
        state.balance = Number(data.balance);
        updateBalance();
      }

      const txContainer = document.getElementById("transactions");
      if (txContainer && Array.isArray(data.transactions)) {
        if (data.transactions.length === 0) {
          txContainer.textContent = "No transactions yet.";
        } else {
          txContainer.innerHTML = data.transactions.map(tx => `
            <div class="transactionRow">
              <div style="display:flex;justify-content:space-between">
                <strong>${tx.type.toUpperCase()} (${tx.provider || "MANUAL"})</strong>
                <span class="transactionStatus status${tx.status.charAt(0).toUpperCase() + tx.status.slice(1).toLowerCase()}">${tx.status}</span>
              </div>
              <div style="display:flex;justify-content:space-between;color:#aaa">
                <span>Ref: ${tx.referenceId || tx.id || "—"}</span>
                <strong style="color:${tx.type === 'deposit' ? '#18d66b' : '#ff5555'}">${tx.type === 'deposit' ? '+' : '-'}${Number(tx.amount).toFixed(2)} ETB</strong>
              </div>
            </div>
          `).join("");
        }
      }
    }
  } catch (err) {
    console.error("Failed to fetch transaction history:", err);
  }
}

/* =========================================================
   INIT
========================================================= */

window.addEventListener("DOMContentLoaded", () => {
  loadTelegramUser();
  updateBalance();
  buildKeno();
});
</script>

<!-- ======================================================
     DEPOSIT MODAL
====================================================== -->
<div id="depositModal" class="walletModal hidden">
  <div class="walletModalPanel">
    <div class="walletModalHead">
      <h2>DEPOSIT ETB</h2>
      <button class="walletModalClose" onclick="closeDeposit()">✕</button>
    </div>

    <div class="walletHint">
      Send funds to our official Telebirr / CBE Birr account, then enter the amount and transaction ID below for instant verification.
    </div>

    <label class="walletFormLabel">PAYMENT PROVIDER</label>
    <select id="depProvider" class="walletFormSelect">
      <option value="telebirr">Telebirr</option>
      <option value="cbe_birr">CBE Birr</option>
      <option value="cbe_bank">CBE Bank Transfer</option>
    </select>

    <label class="walletFormLabel">AMOUNT (ETB)</label>
    <input id="depAmount" type="number" class="walletFormInput" placeholder="Minimum 10 ETB" min="10">

    <label class="walletFormLabel">TRANSACTION / REFERENCE ID</label>
    <input id="depRef" type="text" class="walletFormInput" placeholder="e.g. TX12345678">

    <button class="walletSubmit" onclick="submitDeposit()">SUBMIT DEPOSIT</button>
    <div id="depStatus" class="walletStatus"></div>
    <div id="transactions" style="margin-top:15px; max-height:150px; overflow-y:auto;"></div>
  </div>
</div>

<!-- ======================================================
     WITHDRAW MODAL
====================================================== -->
<div id="withdrawModal" class="walletModal hidden">
  <div class="walletModalPanel">
    <div class="walletModalHead">
      <h2>WITHDRAW ETB</h2>
      <button class="walletModalClose" onclick="closeWithdraw()">✕</button>
    </div>

    <div class="walletHint">
      Withdrawals are processed to your mobile wallet or bank account once verified.
    </div>

    <label class="walletFormLabel">RECEIVING METHOD</label>
    <select id="wdProvider" class="walletFormSelect">
      <option value="telebirr">Telebirr</option>
      <option value="cbe_birr">CBE Birr</option>
      <option value="cbe_bank">CBE Bank Transfer</option>
    </select>

    <label class="walletFormLabel">AMOUNT (ETB)</label>
    <input id="wdAmount" type="number" class="walletFormInput" placeholder="Minimum 50 ETB" min="50">

    <label class="walletFormLabel">PHONE / ACCOUNT NUMBER</label>
    <input id="wdAccount" type="tel" class="walletFormInput" placeholder="e.g. 0912345678">

    <button class="walletSubmit" onclick="submitWithdraw()">SUBMIT WITHDRAWAL</button>
    <div id="wdStatus" class="walletStatus"></div>
  </div>
</div>

</body>
</html>
