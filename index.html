<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>DESTA PLAY</title>

<meta
    name="description"
    content="DESTA PLAY - Games, entertainment and player dashboard"
/>

<style>
:root {
    --bg: #07111f;
    --bg2: #0c1728;
    --card: #111f33;
    --card2: #15263d;
    --border: rgba(255,255,255,.08);
    --text: #f5f7fb;
    --muted: #8fa2bb;
    --gold: #f5b942;
    --gold2: #ffd66b;
    --green: #20d18a;
    --red: #ff4f64;
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --shadow: 0 15px 45px rgba(0,0,0,.28);
    --radius: 18px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at top right, rgba(59,130,246,.12), transparent 30%),
        radial-gradient(circle at bottom left, rgba(139,92,246,.09), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    padding-bottom: 90px;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

.hidden {
    display: none !important;
}

.app {
    width: 100%;
    max-width: 520px;
    margin: auto;
    min-height: 100vh;
}

/* HEADER */

.header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: rgba(7,17,31,.92);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-logo {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background:
        linear-gradient(135deg, var(--gold), #d98b17);
    color: #08111e;
    font-weight: 900;
    box-shadow: 0 8px 25px rgba(245,185,66,.2);
}

.brand-name {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: .5px;
}

.brand-sub {
    font-size: 10px;
    color: var(--muted);
}

.header-actions {
    display: flex;
    gap: 7px;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
}

/* MAIN */

main {
    padding: 16px;
}

.page-title {
    font-size: 25px;
    font-weight: 900;
    margin: 8px 0 5px;
}

.page-subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 18px;
}

/* WALLET */

.wallet-card {
    background:
        linear-gradient(135deg, #182b46, #0d192b);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
}

.wallet-label {
    color: var(--muted);
    font-size: 12px;
}

.wallet-balance {
    font-size: 30px;
    font-weight: 900;
    margin: 5px 0 14px;
}

.wallet-actions {
    display: flex;
    gap: 8px;
}

.primary-btn,
.secondary-btn,
.danger-btn {
    min-height: 44px;
    border-radius: 12px;
    padding: 0 15px;
    font-weight: 800;
}

.primary-btn {
    background: linear-gradient(135deg, var(--gold2), var(--gold));
    color: #10151d;
}

.secondary-btn {
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
}

.danger-btn {
    background: rgba(255,79,100,.13);
    color: #ff8292;
    border: 1px solid rgba(255,79,100,.2);
}

/* GAME GRID */

.section-title {
    font-size: 15px;
    font-weight: 900;
    margin: 20px 0 10px;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 11px;
}

.game-card {
    position: relative;
    min-height: 145px;
    padding: 16px;
    border-radius: var(--radius);
    background:
        linear-gradient(145deg, var(--card2), var(--card));
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,.15);
    transition: transform .18s ease;
}

.game-card:active {
    transform: scale(.97);
}

.game-icon {
    font-size: 34px;
    margin-bottom: 14px;
}

.game-name {
    font-weight: 900;
}

.game-description {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.game-badge {
    position: absolute;
    top: 11px;
    right: 11px;
    font-size: 9px;
    padding: 4px 7px;
    border-radius: 20px;
    background: rgba(32,209,138,.12);
    color: var(--green);
}

/* GAME HEADER */

.game-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.back-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--muted);
    background: transparent;
    padding: 4px 0;
}

.game-title {
    font-size: 22px;
    font-weight: 900;
}

.game-tools {
    display: flex;
    gap: 7px;
}

.small-btn {
    min-width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
}

/* STATUS */

.status-card {
    text-align: center;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--border);
}

.status-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.countdown {
    font-size: 32px;
    font-weight: 900;
    margin-top: 3px;
    color: var(--gold2);
}

.status-message {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

/* SLOTS */

.slot-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 14px 0;
}

.slot-count {
    font-size: 13px;
    font-weight: 900;
}

.round-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 20px;
    font-weight: 900;
}

.round-btn:disabled {
    opacity: .35;
}

.slots {
    display: grid;
    gap: 12px;
}

.slot-card {
    background:
        linear-gradient(145deg, #14243a, #0e1a2b);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px;
}

.slot-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.slot-title {
    font-weight: 900;
}

.slot-status {
    font-size: 10px;
    color: var(--muted);
}

.bet-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.amount-control {
    flex: 1;
    display: flex;
    align-items: center;
    height: 44px;
    border-radius: 12px;
    background: #091523;
    border: 1px solid var(--border);
    overflow: hidden;
}

.amount-control button {
    width: 43px;
    height: 100%;
    background: transparent;
    color: var(--text);
    font-size: 20px;
}

.amount-input {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: transparent;
    border: 0;
    outline: 0;
    text-align: center;
    color: var(--text);
    font-weight: 900;
}

.place-bet {
    width: 100%;
    margin-top: 10px;
    min-height: 46px;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--gold2), var(--gold));
    color: #0c1420;
    font-weight: 950;
}

.place-bet:disabled {
    opacity: .38;
    cursor: not-allowed;
}

.payout-info {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    color: var(--muted);
    font-size: 11px;
}

.payout-value {
    color: var(--green);
    font-weight: 900;
}

/* ROULETTE */

.roulette-wheel {
    width: 210px;
    height: 210px;
    margin: 12px auto 18px;
    border-radius: 50%;
    border: 8px solid #c99536;
    background:
        conic-gradient(
            #c73646 0deg 9.73deg,
            #151d28 9.73deg 19.46deg,
            #c73646 19.46deg 29.19deg,
            #151d28 29.19deg 38.92deg,
            #c73646 38.92deg 48.65deg,
            #151d28 48.65deg 58.38deg,
            #c73646 58.38deg 68.11deg,
            #151d28 68.11deg 77.84deg,
            #c73646 77.84deg 87.57deg,
            #151d28 87.57deg 97.3deg,
            #c73646 97.3deg 107.03deg,
            #151d28 107.03deg 116.76deg,
            #c73646 116.76deg 126.49deg,
            #151d28 126.49deg 136.22deg,
            #c73646 136.22deg 145.95deg,
            #151d28 145.95deg 155.68deg,
            #c73646 155.68deg 165.41deg,
            #151d28 165.41deg 175.14deg,
            #c73646 175.14deg 184.87deg,
            #151d28 184.87deg 194.6deg,
            #c73646 194.6deg 204.33deg,
            #151d28 204.33deg 214.06deg,
            #c73646 214.06deg 223.79deg,
            #151d28 223.79deg 233.52deg,
            #c73646 233.52deg 243.25deg,
            #151d28 243.25deg 252.98deg,
            #c73646 252.98deg 262.71deg,
            #151d28 262.71deg 272.44deg,
            #c73646 272.44deg 282.17deg,
            #151d28 282.17deg 291.9deg,
            #c73646 291.9deg 301.63deg,
            #151d28 301.63deg 311.36deg,
            #c73646 311.36deg 321.09deg,
            #151d28 321.09deg 330.82deg,
            #c73646 330.82deg 340.55deg,
            #151d28 340.55deg 350.28deg,
            #138d63 350.28deg 360deg
        );
    box-shadow:
        0 0 0 5px #172131,
        0 15px 50px rgba(0,0,0,.45);
    transition: transform 3s cubic-bezier(.12,.72,.18,1);
    display: grid;
    place-items: center;
}

.roulette-wheel.spinning {
    transform: rotate(1440deg);
}

.wheel-center {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: #091421;
    border: 4px solid #c99536;
    display: grid;
    place-items: center;
    font-size: 25px;
    font-weight: 950;
}

/* ROULETTE BOARD */

.roulette-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
}

.number-btn {
    min-height: 43px;
    border-radius: 8px;
    color: white;
    font-weight: 900;
    border: 1px solid rgba(255,255,255,.08);
}

.number-red {
    background: #b83245;
}

.number-black {
    background: #18212d;
}

.number-green {
    background: #16845d;
}

.number-btn.selected {
    outline: 3px solid var(--gold);
    transform: scale(.96);
}

.bet-options {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 7px;
    margin-top: 8px;
}

.bet-option {
    min-height: 42px;
    border-radius: 10px;
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 800;
}

.bet-option.selected {
    background: rgba(245,185,66,.14);
    border-color: var(--gold);
    color: var(--gold2);
}

.odds-box {
    margin-top: 10px;
    padding: 11px;
    border-radius: 11px;
    background: rgba(32,209,138,.06);
    border: 1px solid rgba(32,209,138,.12);
    font-size: 11px;
    color: var(--muted);
}

/* KENO */

.keno-grid {
    display: grid;
    grid-template-columns: repeat(8,1fr);
    gap: 5px;
}

.keno-number {
    aspect-ratio: 1;
    border-radius: 8px;
    background: var(--card2);
    color: var(--text);
    font-size: 11px;
    font-weight: 800;
    border: 1px solid var(--border);
}

.keno-number.selected {
    background: var(--gold);
    color: #07111f;
}

.keno-number.drawn {
    background: var(--red);
    color: white;
}

.keno-number.selected.drawn {
    background: var(--green);
    color: #07111f;
}

/* BINGO */

.bingo-card {
    background: #f5f5f5;
    border-radius: 15px;
    padding: 7px;
}

.bingo-head {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 4px;
    margin-bottom: 4px;
}

.bingo-head div {
    text-align: center;
    color: #172131;
    font-weight: 950;
}

.bingo-grid {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 4px;
}

.bingo-cell {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 6px;
    background: white;
    color: #172131;
    font-weight: 900;
    border: 1px solid #ddd;
}

.bingo-cell.called {
    background: #e84855;
    color: white;
}

.bingo-cell.free {
    background: #f5b942;
    color: #172131;
}

.bingo-card-number {
    color: var(--muted);
    text-align: center;
    margin: 9px 0;
    font-size: 12px;
}

/* AVIATOR */

.aviator-stage {
    position: relative;
    height: 270px;
    overflow: hidden;
    border-radius: var(--radius);
    background:
        radial-gradient(circle at 75% 25%, rgba(255,255,255,.16), transparent 2%),
        radial-gradient(circle at 20% 40%, rgba(255,255,255,.1), transparent 1.5%),
        linear-gradient(180deg,#102b48,#081321);
    border: 1px solid var(--border);
}

.multiplier {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 55px;
    font-weight: 950;
    color: var(--green);
    z-index: 2;
}

.plane {
    position: absolute;
    left: 15%;
    bottom: 18%;
    font-size: 48px;
    transform: rotate(-18deg);
    transition: all .2s linear;
    z-index: 3;
}

.flight-line {
    position: absolute;
    left: -10%;
    bottom: 15%;
    width: 120%;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transform: rotate(-18deg);
    opacity: .6;
}

.cashout-btn {
    width: 100%;
    min-height: 48px;
    margin-top: 9px;
    border-radius: 13px;
    background: linear-gradient(135deg,#25e49a,#10b981);
    color: #031b12;
    font-weight: 950;
}

.cashout-btn:disabled {
    opacity: .35;
}

/* HELP */

.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
}

.modal {
    width: 100%;
    max-width: 520px;
    max-height: 82vh;
    overflow-y: auto;
    background: #0e1b2d;
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 20px;
    box-shadow: 0 -20px 70px rgba(0,0,0,.45);
}

.modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.modal-title {
    font-size: 20px;
    font-weight: 950;
}

.close-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card2);
    color: var(--text);
}

.help-section {
    margin-bottom: 18px;
}

.help-section h3 {
    font-size: 14px;
    color: var(--gold2);
    margin-bottom: 7px;
}

.help-section p,
.help-section li {
    color: #aebdd0;
    font-size: 13px;
    line-height: 1.6;
}

.help-section ul {
    padding-left: 18px;
}

/* BOTTOM NAV */

.bottom-nav {
    position: fixed;
    z-index: 60;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 520px;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
    background: rgba(7,17,31,.96);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
}

.nav-btn {
    background: transparent;
    color: var(--muted);
    min-height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 10px;
}

.nav-btn.active {
    color: var(--gold2);
}

.nav-icon {
    font-size: 20px;
}

/* TOAST */

.toast {
    position: fixed;
    z-index: 200;
    left: 50%;
    bottom: 88px;
    transform: translateX(-50%) translateY(20px);
    width: calc(100% - 32px);
    max-width: 480px;
    padding: 13px 15px;
    border-radius: 13px;
    background: #17263b;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: .25s ease;
    font-size: 12px;
    text-align: center;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* PROFILE */

.profile-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
}

.avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg,var(--gold),var(--purple));
    display: grid;
    place-items: center;
    font-size: 28px;
    margin-bottom: 12px;
}

.profile-name {
    font-weight: 950;
    font-size: 20px;
}

.profile-line {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

.menu-list {
    display: grid;
    gap: 8px;
    margin-top: 15px;
}

.menu-item {
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-radius: 12px;
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
}

/* RESPONSIVE */

@media (max-width: 360px) {

    main {
        padding: 12px;
    }

    .keno-grid {
        gap: 3px;
    }

    .keno-number {
        font-size: 10px;
    }

    .game-card {
        min-height: 130px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="brand">

        <div class="brand-logo">
            DP
        </div>

        <div>
            <div class="brand-name">
                DESTA PLAY
            </div>

            <div class="brand-sub">
                PLAY • WIN • ENJOY
            </div>
        </div>

    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            id="languageButton"
            onclick="toggleLanguage()"
        >
            EN
        </button>

        <button
            class="icon-btn"
            onclick="openHelp()"
        >
            ?
        </button>

    </div>

</header>


<main id="appContent"></main>


<nav class="bottom-nav">

    <button
        class="nav-btn active"
        id="navHome"
        onclick="showHome()"
    >
        <span class="nav-icon">⌂</span>
        <span data-i18n="home">Home</span>
    </button>

    <button
        class="nav-btn"
        onclick="showWallet()"
    >
        <span class="nav-icon">▣</span>
        <span data-i18n="wallet">Wallet</span>
    </button>

    <button
        class="nav-btn"
        onclick="showTopPlayers()"
    >
        <span class="nav-icon">🏆</span>
        <span data-i18n="top">Top</span>
    </button>

    <button
        class="nav-btn"
        onclick="showProfile()"
    >
        <span class="nav-icon">●</span>
        <span data-i18n="profile">Profile</span>
    </button>

</nav>

</div>


<!-- HELP MODAL -->

<div
    class="modal-backdrop hidden"
    id="helpModal"
    onclick="closeHelpOutside(event)"
>

    <div class="modal">

        <div class="modal-head">

            <div
                class="modal-title"
                id="helpTitle"
            >
                Help & Instructions
            </div>

            <button
                class="close-btn"
                onclick="closeHelp()"
            >
                ×
            </button>

        </div>

        <div id="helpContent"></div>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>


<script>

/*
|--------------------------------------------------------------------------
| CONFIGURATION
|--------------------------------------------------------------------------
*/

const API_BASE = "";

const GAME_NAMES = [
    "roulette",
    "keno",
    "bingo",
    "aviator"
];

let currentPage = "home";
let currentGame = "roulette";

let language =
    localStorage.getItem("desta_language") || "en";

let slotCount = 2;

const slots = {

    1: {
        amount: 10,
        bet: null,
        placed: false
    },

    2: {
        amount: 10,
        bet: null,
        placed: false
    }
};

let currentRound = null;

/*
|--------------------------------------------------------------------------
| TRANSLATION HELPER
|--------------------------------------------------------------------------
*/

function t(key) {

    return (
        translations[language][key] ||
        translations.en[key] ||
        key
    );
}


/*
|--------------------------------------------------------------------------
| LANGUAGE
|--------------------------------------------------------------------------
*/

function toggleLanguage() {

    language =
        language === "en"
            ? "am"
            : "en";

    localStorage.setItem(
        "desta_language",
        language
    );

    render();

    if (
        currentPage === "game"
    ) {
        renderGame();
    }
}


/*
|--------------------------------------------------------------------------
| VOICE
|--------------------------------------------------------------------------
*/

function speak(
    text,
    lang = language === "am"
        ? "am-ET"
        : "en-US"
) {

    if (
        !speechEnabled ||
        !("speechSynthesis" in window)
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            String(text)
        );

    utterance.lang = lang;

    utterance.rate =
        currentGame === "keno"
            ? 0.72
            : 0.9;

    utterance.pitch = 1;

    window.speechSynthesis.speak(
        utterance
    );
}


/*
|--------------------------------------------------------------------------
| TOAST
|--------------------------------------------------------------------------
*/

let toastTimer = null;

function toast(message) {

    const element =
        document.getElementById(
            "toast"
        );

    element.textContent =
        message;

    element.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(() => {

            element.classList.remove(
                "show"
            );

        }, 2600);
}

/*
|--------------------------------------------------------------------------
| RENDER GAME
|--------------------------------------------------------------------------
*/

function renderGame() {

    if (
        currentPage !== "game"
    ) {
        return;
    }

    const content =
        document.getElementById(
            "appContent"
        );

    let html =
        gameHeader();


    if (
        currentGame === "roulette"
    ) {

        html +=
            renderRoulette();

    } else if (
        currentGame === "keno"
    ) {

        html +=
            renderKeno();

    } else if (
        currentGame === "bingo"
    ) {

        html +=
            renderBingo();

    } else if (
        currentGame === "aviator"
    ) {

        html +=
            renderAviator();
    }


    content.innerHTML =
        html;
}


/*
|--------------------------------------------------------------------------
| STATUS
|--------------------------------------------------------------------------
*/

function renderStatus() {

    let seconds =
        currentRound
            ? getRemaining()
            : 60;

    let status =
        currentRound
            ? currentRound.status
            : "BETTING";


    if (
        status ===
        "WAITING_FOR_NEXT_ROUND"
    ) {

        status =
            "WAITING";
    }


    if (
        status === "BETTING"
    ) {

        return `

            <div class="status-card">

                <div class="status-label">
                    ${t("betting")}
                </div>

                <div class="countdown">
                    ${formatTime(seconds)}
                </div>

                <div class="status-message">
                    Place your bets before the countdown ends.
                </div>

            </div>
        `;
    }


    return `

        <div class="status-card">

            <div class="status-label">
                ${t("waiting")}
            </div>

            <div class="status-message">
                ${t("waiting")}
            </div>

        </div>
    `;
}

            ${rouletteBetButton("dozen2","2nd 12")}

            ${rouletteBetButton("dozen3","3rd 12")}

            ${rouletteBetButton("column2","COLUMN 2")}

function rouletteNumbers() {

    let html = "";

    for (
        let number = 0;
        number <= 36;
        number++
    ) {

        let cls =
            "number-btn ";

        if (
            number === 0
        ) {

            cls +=
                "number-green";

        } else if (
            [
                1,3,5,7,9,
                12,14,16,18,
                19,21,23,25,27,
                30,32,34,36
            ].includes(number)
        ) {

            cls +=
                "number-red";

        } else {

            cls +=
                "number-black";
        }


        if (
            rouletteSelection ===
            number
        ) {

            cls +=
                " selected";
        }


        html += `

            <button
                class="${cls}"
                onclick="selectRouletteNumber(${number})"
            >
                ${number}
            </button>
        `;
    }

    return html;
}


function rouletteBetButton(
    type,
    label
) {

    return `

        <button
            class="bet-option"
            onclick="selectRouletteBet('${type}')"
        >
            ${label}
        </button>
    `;
}


function selectRouletteNumber(
    number
) {

    rouletteSelection =
        number;

    slots[1].bet = {
        type: "straight",
        number,
        amount: slots[1].amount
    };

    renderGame();

    toast(
        `Number ${number} selected`
    );
}


function selectRouletteBet(
    type
) {

    const bet =
        convertRouletteBet(
            type
        );

    if (!bet) {
        return;
    }

    slots[1].bet = {

        ...bet,

        amount:
            slots[1].amount
    };

    renderGame();

    toast(
        `${type.toUpperCase()} selected`
    );
}


function convertRouletteBet(
    type
) {

    if (
        type === "red" ||
        type === "black" ||
        type === "odd" ||
        type === "even" ||
        type === "low" ||
        type === "high"
    ) {

        return {
            type
        };
    }


    if (
        type.startsWith("dozen")
    ) {

        return {

            type: "dozen",

            dozen:
                Number(
                    type.replace(
                        "dozen",
                        ""
                    )
                )
        };
    }


    if (
        type.startsWith("column")
    ) {

        return {

            type: "column",

            column:
                Number(
                    type.replace(
                        "column",
                        ""
                    )
                )
        };
    }


    return null;
}

|--------------------------------------------------------------------------
| KENO
|--------------------------------------------------------------------------
*/

function renderKeno() {

    return `

        ${renderStatus()}

        <div class="section-title">
            ${t("selectNumbers")}
            (${kenoSelections.size}/10)
        </div>

        <div class="keno-grid">

            ${kenoNumbers()}

        </div>

        ${renderSlots("keno")}

    `;
}


function kenoNumbers() {

    let html = "";

    for (
        let number = 1;
        number <= 80;
        number++
    ) {

        const selected =
            kenoSelections.has(
                number
            );

        const drawn =
            currentRound?.drawnNumbers
                ?.includes(number);

        html += `

            <button
                class="keno-number
                    ${selected ? "selected" : ""}
                    ${drawn ? "drawn" : ""}
                    ${selected && drawn ? "drawn" : ""}"
                onclick="toggleKenoNumber(${number})"
            >
                ${number}
            </button>
        `;
    }

    return html;
}


function toggleKenoNumber(
    number
) {

    if (
        kenoSelections.has(
            number
        )
    ) {

        kenoSelections.delete(
            number
        );

    } else {

        if (
            kenoSelections.size >= 10
        ) {

            toast(
                "Maximum 10 numbers"
            );

            return;
        }

        kenoSelections.add(
            number
        );
    }

    slots[1].bet = {

        selection:
            [...kenoSelections],

        amount:
            slots[1].amount
    };

    renderGame();
}

function renderBingoCard() {

    if (!bingoCard) {

        return `
            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    color:#667;
                    padding:30px;
                "
            >
                Select your Cartela.
            </div>
        `;
    }


    let html = "";


    for (
        let row = 0;
        row < 5;
        row++
    ) {

        for (
            let col = 0;
            col < 5;
            col++
        ) {

            const value =
                bingoCard[row][col];

            const called =
                value !== "FREE" &&
                currentRound?.drawnNumbers
                    ?.includes(value);

            const cls =
                value === "FREE"
                    ? "bingo-cell free"
                    : called
                        ? "bingo-cell called"
                        : "bingo-cell";


            html += `

                <button
                    class="${cls}"
                    onclick="tapBingoCell(${row},${col})"
                >
                    ${value}
                </button>
            `;
        }
    }

    return html;
}


function tapBingoCell(
    row,
    col
) {

    if (!bingoCard) {
        return;
    }

    const value =
        bingoCard[row][col];

    if (
        value === "FREE"
    ) {
        return;
    }


    if (
        currentRound?.drawnNumbers
            ?.includes(value)
    ) {

        toast(
            `Marked ${value}`
        );
    }
}

function renderSlots(
    game
) {

    let html =
        `<div class="slot-controls">`;

    html += `

        <button
            class="round-btn"
            onclick="removeSlot()"
            ${slotCount <= 1 ? "disabled" : ""}
        >
            −
        </button>

        <div class="slot-count">
            ${slotCount} ${t("slot")}${slotCount > 1 ? "S" : ""}
        </div>

        <button
            class="round-btn"
            onclick="addSlot()"
            ${slotCount >= 2 ? "disabled" : ""}
        >
            +

    html +=
        `<div class="slots">`;


    for (
        let i = 1;
        i <= slotCount;
        i++

        html +=
            renderSlot(
                i,
                game
            );
    }


    html +=
        `</div>`;

    return html;
}

/*
|--------------------------------------------------------------------------
| ROULETTE DESCRIPTION
|--------------------------------------------------------------------------
*/

function describeRouletteBet(
    bet
) {

    if (!bet) {
        return t("noBet");
    }

    if (
        bet.type === "straight"
    ) {

        return `Number ${bet.number}`;
    }

    if (
        bet.type === "dozen"
    ) {

        return `Dozen ${bet.dozen}`;
    }

    if (
        bet.type === "column"
    ) {

        return `Column ${bet.column}`;
    }

    return bet.type.toUpperCase();
}


/*
|--------------------------------------------------------------------------
| PAYOUT DISPLAY
|--------------------------------------------------------------------------
*/

function roulettePayout(
    bet
) {

    if (!bet) {
        return "—";
    }


    const payouts = {

        straight: "28.8×",

        red: "0.8×",

        black: "0.8×",

        odd: "0.8×",

        even: "0.8×",

        low: "0.8×",

        high: "0.8×",

        dozen: "1.666667×",

        column: "1.666667×"
    };


    return (
        payouts[
            bet.type
        ] || "—"
    );
}


/*
|--------------------------------------------------------------------------
| SLOT COUNT
|--------------------------------------------------------------------------
*/

function addSlot() {

    if (
        slotCount >= 2
    ) {
        return;
    }

    slotCount = 2;

    renderGame();
}


function removeSlot() {

    if (
        slotCount <= 1
    ) {
        return;
    }

    slotCount = 1;

    slots[2].bet =
        null;

    slots[2].placed =
        false;

    renderGame();
}


/*
|--------------------------------------------------------------------------
| AMOUNT
|--------------------------------------------------------------------------
*/

function changeAmount(
    slotNumber,
    direction
) {

    const current =
        Number(
            slots[slotNumber].amount
        ) || 1;

    const next =
        Math.max(
            1,
            current + direction
        );

    slots[slotNumber].amount =
        next;

    if (
        slots[slotNumber].bet
    ) {

        slots[slotNumber].bet.amount =
            next;
    }

    renderGame();
}


function setAmount(
    slotNumber,
    value
) {

    const amount =
        Math.max(
            1,
            Math.floor(
                Number(value) || 1
            )
        );

    slots[slotNumber].amount =
        amount;

    if (
        slots[slotNumber].bet
    ) {

        slots[slotNumber].bet.amount =
            amount;
    }
}


/*
|--------------------------------------------------------------------------
| PLACE BET
|--------------------------------------------------------------------------
*/

async function placeBet(
    slotNumber
) {

    if (
        !canBet()
    ) {

        toast(
            t("waiting")
        );

        return;
    }


    const slot =
        slots[slotNumber];


    if (!slot) {
        return;
    }


    let bet =
        slot.bet;


    /*
     * Keno.
     */

    if (
        currentGame === "keno"
    ) {

        if (
            kenoSelections.size === 0
        ) {

            toast(
                "Select at least one number"
            );

            return;
        }

        bet = {

            selection:
                [...kenoSelections],

            amount:
                slot.amount
        };
    }


    /*
     * Bingo.
     */

    if (
        currentGame === "bingo"
    ) {

        bet = {

            cartela:
                bingoCardNumber,

            amount:
                slot.amount
        };
    }


    /*
     * Aviator.
     */

    if (
        currentGame === "aviator"
    ) {

        bet = {

            amount:
                slot.amount
        };
    }


    if (
        currentGame === "roulette" &&
        !bet
    ) {

        toast(
            "Choose a roulette bet first"
        );

        return;
    }


    if (
        currentGame === "bingo" &&
        !bingoCardNumber
    ) {

        toast(
            "Choose your Cartela number first"
        );

        return;
    }


    try {

        const endpoint =
            `/api/${currentGame}/bet`;


        /*
         * This request is ready for
         * your backend route.
         */

        const response =
            await fetch(
                API_BASE +
                endpoint,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            slot:
                                slotNumber,

                            amount:
                                slot.amount,

                            bet,

                            playerId:
                                getPlayerId()
                        })
                }
            );


        if (
            response.ok
        ) {

            slot.placed =
                true;

            toast(
                t("betPlaced")
            );

            renderGame();

        } else {

            /*
             * If your current backend
             * doesn't have /api/game/bet
             * yet, don't falsely show a
             * successful real-money bet.
             */

            const data =
                await safeJson(
                    response
                );

            toast(
                data?.error ||
                "Bet could not be placed"
            );
        }

    } catch (error) {

        toast(
            "Backend connection unavailable"
        );

        console.error(
            error
        );
    }
}


/*
|--------------------------------------------------------------------------
| PLAYER ID
|--------------------------------------------------------------------------
|
| This is only a browser identifier.
| It is NOT a secure wallet/account ID.
|--------------------------------------------------------------------------
*/

function getPlayerId() {

    let id =
        localStorage.getItem(
            "desta_player_id"
        );

    if (!id) {

        id =
            "player-" +
            crypto.randomUUID();

        localStorage.setItem(
            "desta_player_id",
            id
        );
    }

    return id;
}


/*
|--------------------------------------------------------------------------
| ROUND API
|--------------------------------------------------------------------------
*/

async function loadRound() {

    try {

        const response =
            await fetch(
                `${API_BASE}/api/game/${currentGame}/round`
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Round request failed"
            );
        }


        const data =
            await response.json();


        if (
            data.success
        ) {

            currentRound =
                data.round;

            renderGame();

            startRoundTimer();
        }

    } catch (error) {

        console.error(
            error
        );

        /*
         * Local visual fallback.
         * This does NOT create a real
         * backend round.
         */

        currentRound = {

            status:
                "BETTING",

            bettingEndsAt:
                Date.now() +
                60000,

            drawnNumbers:
                []
        };

        renderGame();

        startRoundTimer();
    }
}


/*
|--------------------------------------------------------------------------
| ROUND TIMER
|--------------------------------------------------------------------------
*/

function startRoundTimer() {

    clearInterval(
        roundTimer
    );


    roundTimer =
        setInterval(
            async () => {

                if (
                    currentPage !==
                    "game"
                ) {

                    return;
                }


                const remaining =
                    getRemaining();


                if (
                    remaining <= 0
                ) {

                    clearInterval(
                        roundTimer
                    );


                    /*
                     * Do not allow
                     * new bets.
                     */

                    if (
                        currentRound
                    ) {

                        currentRound.status =
                            "WAITING_FOR_NEXT_ROUND";
                    }


                    renderGame();


                    /*
                     * Refresh backend
                     * round after a short
                     * delay.
                     */

                    setTimeout(
                        loadRound,
                        2500
                    );

                    return;
                }


                updateCountdownOnly();

            },
            1000
        );
}


/*
|--------------------------------------------------------------------------
| REMAINING
|--------------------------------------------------------------------------
*/

function getRemaining() {

    if (
        !currentRound
    ) {
        return 60;
    }


    if (
        currentRound.remainingSeconds !==
        undefined
    ) {

        if (
            currentRound.bettingEndsAt
        ) {

            return Math.max(
                0,
                Math.ceil(
                    (
                        new Date(
                            currentRound.bettingEndsAt
                        ).getTime() -
                        Date.now()
                    ) / 1000
                )
            );
        }

        return Number(
            currentRound.remainingSeconds
        ) || 0;
    }


    if (
        currentRound.bettingEndsAt
    ) {

        return Math.max(
            0,
            Math.ceil(
                (
                    new Date(
                        currentRound.bettingEndsAt
                    ).getTime() -
                    Date.now()
                ) / 1000
            )
        );
    }


    return 0;
}


function formatTime(
    seconds
) {

    seconds =
        Math.max(
            0,
            Number(seconds) || 0
        );

    const m =
        Math.floor(
            seconds / 60
        );

    const s =
        seconds % 60;

    return (
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0")
    );
}


function canBet() {

    if (
        !currentRound
    ) {
        return true;
    }

    if (
        currentRound.status !==
        "BETTING"
    ) {
        return false;
    }

    return (
        getRemaining() > 0
    );
}


function updateCountdownOnly() {

    const element =
        document.querySelector(
            ".countdown"
        );

    if (
        element &&
        canBet()
    ) {

        element.textContent =
            formatTime(
                getRemaining()
            );
    }


    const buttons =
        document.querySelectorAll(
            ".place-bet"
        );

    buttons.forEach(
        button => {

            button.disabled =
                !canBet();

        }
    );
}
