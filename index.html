<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DESTA PLAY</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#090909;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  display:block;
}

.app{
  width:100%;
  min-height:100vh;
  box-sizing:border-box;
  padding:30px 16px;
  text-align:center;
}

.logo{
  font-size:32px;
  font-weight:900;
  color:#ffcc33;
  margin:30px 0 10px;
}

.subtitle{
  color:#aaa;
  margin-bottom:30px;
}

.game{
  background:#1d1d1d;
  border:1px solid #333;
  border-radius:14px;
  padding:20px;
  margin:12px auto;
  max-width:400px;
}

.game h2{
  margin:0 0 8px;
  color:#ffcc33;
}

.game p{
  color:#aaa;
  margin:0 0 15px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#b40000;
  color:#fff;
  font-size:16px;
  font-weight:900;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">DESTA PLAY</div>

  <div class="subtitle">
    Choose your game
  </div>

  <div class="game">
    <h2>BINGO</h2>
    <p>75-ball Bingo</p>
    <button>PLAY</button>
  </div>

  <div class="game">
    <h2>BINGO 75</h2>
    <p>Standard 75-ball Bingo</p>
    <button>PLAY</button>
  </div>

  <div class="game">
    <h2>BINGO 90</h2>
    <p>Standard 90-ball Bingo</p>
    <button>PLAY</button>
  </div>

  <div class="game">
    <h2>KENO</h2>
    <p>Pick your numbers</p>
    <button>PLAY</button>
  </div>

</div>

</body>
</html>
